name: Deploy Clube CoopereBR VM

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/clube-cooperebr

concurrency:
  group: clube-cooperebr-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_CLUBE_HOST }}
          username: ${{ secrets.AZURE_CLUBE_USER }}
          key: ${{ secrets.AZURE_CLUBE_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            sudo APP_DIR=/opt/cooperebr/app BRANCH=deploy/clube-cooperebr bash /opt/cooperebr/app/deploy/azure-vm/deploy.sh
