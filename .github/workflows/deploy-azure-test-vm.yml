name: Deploy Azure Test VM

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/azure-test

concurrency:
  group: azure-test-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_TEST_HOST }}
          username: ${{ secrets.AZURE_TEST_USER }}
          key: ${{ secrets.AZURE_TEST_SSH_KEY }}
          script_stop: true
          script: |
            APP_DIR=/opt/cooperebr/app BRANCH=deploy/azure-test bash /opt/cooperebr/app/deploy/azure-vm/deploy.sh
